<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="osint-launcher — open-source intelligence toolkit">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#4a0808" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#160505" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a0707"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="55%" stop-color="#ff1f1f"/>
      <stop offset="100%" stop-color="#8a0000"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.28"/>
    </pattern>
    <filter id="bloom" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .glitch { animation: glitch 4s infinite; }
      @keyframes glitch {
        0%, 92%, 100% { transform: translate(0, 0); opacity: 0.55; }
        93% { transform: translate(-6px, 2px); opacity: 0.9; }
        95% { transform: translate(5px, -2px); opacity: 0.8; }
        97% { transform: translate(-2px, 0); opacity: 0.6; }
      }
    </style>
  </defs>

  <rect width="1200" height="320" fill="#0a0707"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- side noise bars -->
  <g class="mono" font-size="14" fill="#5f0000">
    <text x="28" y="40">▓▒░ 0x4f53494e54 ░▒▓</text>
    <text x="1172" y="40" text-anchor="end">░▒▓ case://open ▓▒░</text>
    <text x="28" y="300">[ dedup · corroboration · evidence ]</text>
    <text x="1172" y="300" text-anchor="end">localhost only · no tracking</text>
  </g>

  <!-- title with glitch shadow -->
  <g class="mono" font-weight="800" font-size="92" text-anchor="middle">
    <text x="600" y="162" fill="#ff0000" class="glitch">OSINT·LAUNCHER</text>
    <text x="600" y="162" fill="url(#red)" filter="url(#bloom)">OSINT·LAUNCHER</text>
  </g>

  <!-- tagline -->
  <text x="600" y="206" text-anchor="middle" class="mono" font-size="22" fill="#ffb3b3" letter-spacing="3">
    ░▒▓█ OPEN-SOURCE INTELLIGENCE TOOLKIT █▓▒░
  </text>

  <!-- prompt -->
  <g class="mono" font-size="20">
    <text x="600" y="250" text-anchor="middle">
      <tspan fill="#af0000">root@osint:~$ </tspan><tspan fill="#eeeeee">osint collect night_owl you@example.com</tspan><tspan fill="#ff0000" class="blink">█</tspan>
    </text>
  </g>

  <rect width="1200" height="320" fill="url(#scan)"/>
  <rect x="1" y="1" width="1198" height="318" fill="none" stroke="#af0000" stroke-width="2"/>
</svg>
